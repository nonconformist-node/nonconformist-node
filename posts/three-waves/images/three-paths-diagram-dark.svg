<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Three paths from an emerging alternative</title><desc id="desc">H3 leads to H2, which branches into absorption, transformation, or a new independent H1.</desc>
<style>svg{color:#e8e8e8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.ink{fill:currentColor}.muted{fill:currentColor;opacity:.7}.line{stroke:currentColor;opacity:.62}.panel{fill:none;stroke:currentColor;opacity:.55}text{text-rendering:geometricPrecision}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<rect class="panel" x="250" y="16" width="700" height="88" rx="10" stroke-width="1.35"/><text class="ink" x="600" y="52" text-anchor="middle" font-size="23" font-weight="650">H3 — The alternative emerges</text><text class="muted" x="600" y="80" text-anchor="middle" font-size="16">New technologies, values and ways of organizing.</text>
<path class="line" d="M600 104V143" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="panel" x="95" y="151" width="1010" height="86" rx="10" stroke-width="1.35"/><text class="ink" x="600" y="187" text-anchor="middle" font-size="22" font-weight="650">H2 — The struggle over what comes next</text><text class="muted" x="600" y="214" text-anchor="middle" font-size="16">Absorption, transformation or the development of an independent alternative.</text>
<path class="line" d="M600 237V270H205V294M600 270V294M600 270H995V294" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="line" d="M205 294V309M600 294V309M995 294V309" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="panel" x="25" y="318" width="360" height="132" rx="10" stroke-width="1.35"/><text class="ink" x="205" y="352" text-anchor="middle" font-size="21" font-weight="650">Path A</text><text class="ink" x="205" y="380" text-anchor="middle" font-size="18" font-weight="550">Absorption</text><text class="muted" x="205" y="411" text-anchor="middle" font-size="15">H3 is incorporated into existing H1</text>
<rect class="panel" x="420" y="318" width="360" height="132" rx="10" stroke-width="1.35"/><text class="ink" x="600" y="352" text-anchor="middle" font-size="21" font-weight="650">Path B</text><text class="ink" x="600" y="380" text-anchor="middle" font-size="18" font-weight="550">Transformation</text><text class="muted" x="600" y="411" text-anchor="middle" font-size="15">H3 partially reshapes H1</text>
<rect class="panel" x="815" y="318" width="360" height="132" rx="10" stroke-width="1.35"/><text class="ink" x="995" y="352" text-anchor="middle" font-size="21" font-weight="650">Path C</text><text class="ink" x="995" y="380" text-anchor="middle" font-size="18" font-weight="550">A new H1 emerges</text><text class="muted" x="995" y="411" text-anchor="middle" font-size="15">An independent parallel system</text>
</svg>
